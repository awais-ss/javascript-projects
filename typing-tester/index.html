<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TYPING TESTER</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <nav>
        <img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQtXuD5fDXrKqfJfTARqhBfkyw1PLpK-yYzt7LVQq7fOQ&s=10"
          alt="RAGA"
          class="logo"
        />
        <ul>
          <li>HOME</li>
          <li>ABOUT</li>
          <li>CONTACT</li>
        </ul>
      </nav>
    </header>
    <main>
      <h1 class="mainHeading">SPEED TESTER</h1>
      <h2>Test your typing speed ⚡</h2>
      <div class="info">
        <h2 class="timer">00 : 30</h2>
        <p class="result">WPM: 0</p>
        <p class="accuracy">Accuracy: 0%</p>
        <p class="correct">Correct: 0</p>
        <p class="wrong">Wrong: 0</p>
        <p class="best">Best: 0 WPM</p>
      </div>
      <div class="main">
        <h2 class="lines"></h2>
        <input
          type="text"
          class="input"
          placeholder="Start typing to begin..."
        />
      </div>
      <div class="btn-group">
        <button class="restartBtn">Restart</button>
        <button class="newTextBtn">New Text</button>
        <button class="start">Start</button>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
